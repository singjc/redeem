[workspace]
members = [
    "redeem-classifiers",
    "redeem-cli",
    "redeem-io",
    "redeem-properties",
    "redeem-properties-py",
    "redeem-topaz",
]

resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.5"
rusqlite = "0.32.1"
parquet = "53.0.0"
flate2 = "1.0"
log = "0.4"

# Candle pinned once, workspace-wide
candle-core = { version = "0.8.4", default-features = false, features = [] }
candle-nn = { version = "0.8.4", default-features = false, features = [] }
candle-transformers = { version = "0.8.4", default-features = false, features = [] }
