[package]
name = "redeem-openms-ffi"
version = "0.1.2"
edition = "2021"
rust-version = "1.76"
description = "Thin C ABI for using redeem-properties from OpenMS"

[lib]
name = "redeem_openms_ffi"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0"
# candle-core = { version = "0.8.4", default-features = false }
candle-core = { git = "https://github.com/singjc/candle.git", branch = "add/candle-onnx-export" }
csv = "1.1"
once_cell = "1.20"
redeem-properties = { version = "0.1.2", default-features = false }

[features]
default = []
cuda = ["candle-core/cuda", "redeem-properties/cuda"]

[dev-dependencies]
zip = "2.2.2"
